name: Deploy to GitHub Pages

# Publishes the web build from main at the site root, plus every release tag
# (vX.Y.Z) at its own path (/vX.Y/, newest patch of each X.Y) so old versions
# stay playable. Requires Settings > Pages > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Build archived releases
        run: |
          # Newest patch tag for each X.Y, e.g. v1.0.2 for /v1.0/.
          for minor in $(git tag -l 'v*.*.*' | sed -E 's/^v([0-9]+\.[0-9]+)\..*/\1/' | sort -uV); do
            tag=$(git tag -l "v$minor.*" | sort -V | tail -1)
            echo "Building $tag at /v$minor/"
            git worktree add "../release-$minor" "$tag"
            (cd "../release-$minor" && npm ci && VITE_ARCHIVE="$minor" npx vite build --outDir "$GITHUB_WORKSPACE/dist/v$minor" --emptyOutDir)
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
